[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-decision-intelligence-agent"
version = "0.1.0"
description = "An evidence-driven Fantasy Premier League decision intelligence agent."
requires-python = ">=3.12"
dependencies = [
    "openai-agents",
    "httpx",
    "pydantic>=2",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() are designed to be called as parameter
# defaults; this is the documented ruff remedy for that idiom rather
# than a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true